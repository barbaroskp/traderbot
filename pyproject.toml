[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "bingx-agent"
version = "1.0.0"
description = "24/7 BingX Futures (Swap V2) autonomous trading bot"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "apscheduler>=3.10",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "black>=24.1",
    "respx>=0.21",
]

[project.scripts]
bingx-agent = "src.cli:cli"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
