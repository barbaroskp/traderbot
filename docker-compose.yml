version: "3.9"

services:
  bingx-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bingx-agent
    restart: always
    env_file:
      - .env
    volumes:
      - agent-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "src.cli", "validate-config"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  agent-data:
    driver: local
